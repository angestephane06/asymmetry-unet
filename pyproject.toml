[project]
name = "asymmetry-unet"
version = "0.1.0"
description = "Locating asymmetric regions of 3D surfaces: symmetry-plane ICP baseline vs U-Net, with ONNX export and INT8 quantization."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "torch>=2.4",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "onnxscript>=0.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asymunet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
